name: Retry Today's Instagram (push-triggered)

# Triggered by the SNS Post Health Check routine pushing a sentinel file.
# Defaults to today's JST date — assumes routine runs same JST day as the
# release it's recovering. The existing workflow_dispatch path
# (test-instagram-upload.yml) remains for manual recovery of older dates.

on:
  push:
    paths:
      - .retry-ig-trigger

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve date
        id: date
        env:
          TZ: Asia/Tokyo
        run: |
          DATE=$(date +%Y%m%d)
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "Using date: $DATE"

      - name: Download video asset from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          DATE="${{ steps.date.outputs.date }}"
          gh release download "v${DATE}" -p "coffee-${DATE}.mp4" -D output/

      - name: Generate captions
        env:
          TZ: Asia/Tokyo
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          # Prefer the captions archived with the original post (the recipe
          # numbers in the caption must match the video). Releases created
          # before the archive existed fall back to regenerating.
          if gh release download "v${DATE}" -p "coffee-${DATE}-captions.json" -D output/ --clobber; then
            cp "output/coffee-${DATE}-captions.json" output/captions.json
            echo "Using archived captions from release v${DATE}"
          else
            node scripts/scrape-coffee-news.mjs
            node scripts/generate-data.mjs
            node scripts/generate-caption.mjs
          fi

      - name: Upload to Instagram (resumable)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          node scripts/upload-instagram.mjs --file="output/coffee-${DATE}.mp4"

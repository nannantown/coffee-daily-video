name: Retry Today's Instagram
# The posting clock (sns-hub clock/, a Cloudflare cron) starts each slot on time with
# slot=<that slot's cron line below>; the title marks it so the slot's late `schedule` backup
# (30 min later + GitHub's delay) can see it already started and do nothing.
run-name: ${{ inputs.slot && format('{0} (on time {1})', github.workflow, inputs.slot) || github.workflow }}

# Re-post the day's Reel to Instagram only, from the exact video + captions the
# daily run archived in Release v<YYYYMMDD> — nothing is re-rendered and
# YouTube is never touched.
#
# Automatic (owner order 2026-10-27): four slots look again the same day —
# 12:37 / 14:37 / 17:37 / 20:37 JST. GitHub starts the 08:30 run late
# (10/17–10/26: 10:17–11:00 JST), so the slots sit after that. A slot posts only
# when the day's record has YouTube and no Instagram, daily-video.yml finished
# 45+ min ago (scripts/ig-auto-retry.mjs gate), the video fits a Reel and the
# account does not show the day yet (… check). At most 3 automatic uploads per
# day, and none after 2 ProcessingFailedErrors in a row (data/ig-auto-retry.json).
# A failure an earlier slot can leave to the next is a note (the job has
# continue-on-error); the last slot's failure is red, and so is anything no
# later slot can fix (too long, no archived caption, another post on the
# account, the day's tries spent) — at once.
#
# Switches (repo Variables, scheduled and posting-clock runs only): IG_AUTO_RETRY=off stops all
# automatic retries; IG_AUTO_RETRY_SKIP=20261026,20261023 leaves those days alone.
#
# By hand: gh workflow run retry-today-instagram.yml [-f date=YYYYMMDD]
# The health-check routine's push of .retry-ig-trigger still works (same path).
# test-instagram-upload.yml stays for releases/assets this one does not cover.

on:
  schedule:
    - cron: "7 4 * * *" # backup of 12:37 JST (the posting clock starts it at 12:37)
    - cron: "7 6 * * *" # backup of 14:37 JST (the posting clock starts it at 14:37)
    - cron: "7 9 * * *" # backup of 17:37 JST (the posting clock starts it at 17:37)
    - cron: "7 12 * * *" # backup of 20:37 JST (the posting clock starts it at 20:37) — the last slot: a failure here is red
  workflow_dispatch:
    inputs:
      slot:
        description: "Set only by the posting clock (sns-hub clock/): the cron line of the slot this run stands for. Leave empty by hand"
        type: string
        default: ""
      date:
        description: "YYYYMMDD (empty = the latest 08:30 JST post)"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - .retry-ig-trigger

permissions:
  contents: write # records the post in data/performance-history.json, the tries in data/ig-auto-retry.json
  actions: read # the gate lists daily-video.yml runs (unlisted scopes are none → 403)

# The same lock as daily-video.yml: a retry and a daily post (or its re-run)
# never run at once, so the second one sees what the first posted.
concurrency:
  group: coffee-daily-video-${{ github.ref }}
  queue: max # a waiting run (this or the daily post) is never cancelled by a third
  cancel-in-progress: false

jobs:
  # GitHub starts `schedule` runs hours late, so the posting clock starts each slot on time and
  # the cron above is only a backup. It does nothing when that slot's on-time run started in the
  # last 12 hours, whatever its result (that slot already looked; the next slot looks again).
  backup-gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ format('{0} (on time {1})', github.workflow, github.event.schedule) }}
        run: |
          since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/retry-today-instagram.yml/runs" \
            -f event=workflow_dispatch -f branch=main -f created=">=$since" -F per_page=100 \
            --jq '[.workflow_runs[] | select(.display_title == $ENV.TITLE)] | length')
          echo "\"$TITLE\" runs since $since: $n"
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The posting clock already started this slot on time — this late backup does nothing."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No on-time run of this slot in the last 12 hours — the posting clock missed it, so this backup looks."
          fi

  upload:
    needs: backup-gate
    if: ${{ !cancelled() && (needs.backup-gate.result == 'skipped' || needs.backup-gate.outputs.skip == 'false') }}
    # AUTO: a scheduled slot, or the posting clock's on-time run of one (slot = its cron line).
    env:
      AUTO: ${{ github.event_name == 'schedule' || inputs.slot != '' }}
      EVENT_SCHEDULE: ${{ inputs.slot || github.event.schedule }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # An earlier slot's failure is a note — the next slot tries again. The last slot (and a hand-run) goes red.
    continue-on-error: ${{ (github.event_name == 'schedule' || inputs.slot != '') && (inputs.slot || github.event.schedule) != '7 12 * * *' }}
    outputs:
      stop: ${{ steps.gate.outputs.stop }}${{ steps.captions.outputs.stop }}${{ steps.check.outputs.stop }}${{ steps.count.outputs.stop }}${{ steps.mark.outputs.stop }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Is this an Instagram-only failure? (record has YouTube, no Instagram)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ inputs.date }}
          IG_AUTO_RETRY: ${{ vars.IG_AUTO_RETRY }}
          IG_AUTO_RETRY_SKIP: ${{ vars.IG_AUTO_RETRY_SKIP }}
        run: node scripts/ig-auto-retry.mjs gate --records=data/performance-history.json --post-time=08:30 --last-slot="7 12 * * *" ${INPUT_DATE:+"--date=$INPUT_DATE"}

      - if: steps.gate.outputs.go == 'true'
        run: npm ci

      - name: Download video asset from release
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.gate.outputs.stamp }}
        run: |
          mkdir -p output
          gh release download "v${DATE}" -p "coffee-${DATE}.mp4" -D output/

      - name: Captions archived with the original post
        id: captions
        if: steps.gate.outputs.go == 'true'
        env:
          TZ: Asia/Tokyo
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.gate.outputs.stamp }}
          EVENT: ${{ env.AUTO == 'true' && 'schedule' || github.event_name }}
        run: |
          set -euo pipefail
          # The caption must be the one the video went out with (the numbers in
          # it match the video). Releases created before the archive existed
          # fall back to regenerating — by hand only, never on a schedule.
          assets=$(gh release view "v${DATE}" --json assets -q '.assets[].name')
          if grep -qx "coffee-${DATE}-captions.json" <<<"$assets"; then
            gh release download "v${DATE}" -p "coffee-${DATE}-captions.json" -D output/ --clobber
            cp "output/coffee-${DATE}-captions.json" output/captions.json
            echo "Using archived captions from release v${DATE}"
          elif [ "$EVENT" = schedule ]; then
            echo "stop=v${DATE} has no archived captions — not regenerating a caption on a schedule. Post by hand if needed." >> "$GITHUB_OUTPUT"
            exit 1
          else
            node scripts/generate-data.mjs
            node scripts/generate-caption.mjs
          fi
          # Brand guard: an archived caption may predate 2026-09-22 and name a
          # coffee we sell. Never re-post that (owner decision 2026-09-22).
          node scripts/check-published.mjs

      - name: Fits a Reel, and not on Instagram yet?
        id: check
        if: steps.gate.outputs.go == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          DATE: ${{ steps.gate.outputs.stamp }}
        run: node scripts/ig-auto-retry.mjs check --file="output/coffee-${DATE}.mp4" --captions=output/captions.json --stamp="$DATE" --post-time=08:30

      - name: Count this automatic attempt (before the upload — a crash still counts; a spent day stops here)
        id: count
        if: env.AUTO == 'true' && steps.check.outputs.posted == 'false'
        run: node scripts/ig-auto-retry.mjs mark --stamp="${{ steps.gate.outputs.stamp }}"

      - name: Upload to Instagram (resumable)
        id: upload
        if: steps.gate.outputs.go == 'true' && steps.check.outputs.posted == 'false' && (env.AUTO != 'true' || steps.count.outputs.go == 'true')
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          set -o pipefail
          node scripts/upload-instagram.mjs --file="output/coffee-${{ steps.gate.outputs.stamp }}.mp4" 2>&1 | tee output/ig-upload.log

      - name: Remember why it failed (2 ProcessingFailedErrors in a row stop the day)
        id: mark
        if: failure() && steps.upload.outcome == 'failure' && env.AUTO == 'true'
        run: node scripts/ig-auto-retry.mjs mark --stamp="${{ steps.gate.outputs.stamp }}" --log=output/ig-upload.log

      - name: Record the post
        # The media id reaches data/performance-history.json — the IG median and
        # the saved-count that decide the genre trial read it from there.
        if: always() && steps.gate.outputs.go == 'true' && hashFiles('output/instagram-result.json') != ''
        env:
          DATE: ${{ steps.gate.outputs.date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if ! git fetch --no-tags origin main; then
              echo "fetch attempt $i failed, retrying"; sleep $((i * 10)); continue
            fi
            git checkout -f -B main FETCH_HEAD
            node scripts/record-instagram.mjs --date="$DATE"
            git add data/performance-history.json
            if git diff --staged --quiet; then echo "History unchanged, nothing to commit"; exit 0; fi
            git commit -m "Record Instagram retry ${DATE} [skip ci]"
            if git push origin main; then exit 0; fi
            echo "push attempt $i failed, retrying"; sleep $((i * 10))
          done
          # On an earlier slot this is a note: the next slot finds the post on the account and records it.
          echo "::error title=Instagram retry::the post went out but the history could not be pushed — the next slot (or fetch-stats) records it"
          exit 1

      - name: Not on Instagram yet — a later slot tries again
        if: failure() && env.AUTO == 'true' && env.EVENT_SCHEDULE != '7 12 * * *'
        run: echo "::warning title=Instagram retry::not on Instagram yet (see the failed step above); a later slot tries the same video unless the day's tries are spent"

  # Red at once, on any slot: no later slot can fix these (too long, no archived
  # caption, another post on the account, the day's automatic tries spent).
  needs-a-person:
    needs: upload
    if: always() && needs.upload.outputs.stop != ''
    runs-on: ubuntu-latest
    steps:
      - env:
          STOP: ${{ needs.upload.outputs.stop }}
        run: |
          echo "::error title=Instagram retry stopped::$STOP"
          exit 1

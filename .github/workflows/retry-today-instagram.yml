name: Retry Today's Instagram (push-triggered)

# Today's exact archived video only. Publishing/legacy-unknown records stop
# for manual reconciliation; a fenced pre-publish claim can safely resume.
on:
  push:
    branches: [main]
    paths: [.retry-ig-trigger]

permissions:
  contents: read
concurrency:
  group: coffee-instagram-publication
  cancel-in-progress: false

env:
  NODE_OPTIONS: ""
  NODE_DEBUG: ""
  NODE_DEBUG_NATIVE: ""
  DEBUG: ""
  INSTAGRAM_RECOVERY_ACTION: retry

jobs:
  prepare:
    if: github.repository == 'nannantown/coffee-daily-video' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      write_required: ${{ steps.plan.outputs.write_required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Inspect receipt and pin exact archived assets (GET only)
        id: plan
        run: node scripts/recover-instagram.mjs --prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
  recover:
    needs: prepare
    if: needs.prepare.outputs.write_required == 'true' && github.repository == 'nannantown/coffee-daily-video' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # Only the durable publication receipt; no new Secrets or other grants.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Recover Instagram only using pinned assets and durable claim
        run: node scripts/recover-instagram.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INSTAGRAM_RECOVERY_PLAN: ${{ needs.prepare.outputs.plan }}
          INSTAGRAM_RECEIPT_WRITE_ENABLED: "true"
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

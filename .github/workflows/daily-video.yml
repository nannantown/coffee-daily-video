name: Daily Coffee Video

# Two modes:
#   - production: the schedule (and dispatch on main without dry_run) renders
#     today's video, posts to YouTube + Instagram and commits
#     data/performance-history.json.
#   - verification (dry run): dispatch on any ref other than main, with
#     dry_run=true, or with sample other than "today" (samples are never
#     posted). Renders the video, cover, captions and slide previews into an
#     artifact. No stats fetch, no SNS posting, no commit.
#       gh workflow run daily-video.yml --ref <branch> -f sample=sample

on:
  schedule:
    # 23:00 UTC = 08:00 JST
    # 23:30 UTC = 08:30 JST (30min after AI Trend Daily)
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verification only (always on for refs other than main): artifact, no posting, no commit"
        type: boolean
        default: false
      sample:
        description: "Content for verification: today = data/enriched-coffee-news.json, sample = data/samples/brew-lesson.sample.json, fallback = the evergreen lesson of the day"
        type: choice
        options:
          - today
          - sample
          - fallback
        default: today
  push:
    paths:
      - '.recovery-trigger'

permissions:
  contents: write

# Keep a running publisher alive. Remote receipt SHA checks also guard separate
# writers, old checkouts and interrupted runs before any Buffer mutation.
concurrency:
  group: coffee-daily-video-${{ github.ref }}
  queue: max # shared with retry-today-instagram.yml: a waiting run is never cancelled by a third (GitHub's default would drop it silently)
  cancel-in-progress: false

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fonts + ffmpeg still come from apt (same packages, same versions, so the
      # video looks the same), but the downloaded .deb files (~300 MB) are kept in
      # actions/cache. On 2026-10-23 and 10-27 the Ubuntu mirror served them at
      # ~60 kB/s and this install ran into the job timeout, which GitHub reports
      # as "cancelled" (not red), so the day's post vanished silently. Now a normal
      # day downloads nothing, and a slow mirror fails the install step red within
      # ~5 minutes instead of eating the whole job. Notes:
      # sns-hub docs/operations/2026-10-27-apt-timeout.md
      - name: Resolve apt packages (fonts + ffmpeg)
        id: apt
        timeout-minutes: 2
        run: |
          timeout 60 sudo apt-get update
          # Cache key = hash of the exact .deb files apt would fetch: a package
          # update gives a new key (the old cache is restored, only the new .deb
          # is downloaded, then the new set is saved).
          uris=$(sudo apt-get install --print-uris -qq fonts-noto-cjk fonts-noto-cjk-extra ffmpeg)
          prefix="apt-debs-${ImageOS:-unknown}-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}$(printf '%s' "$uris" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # A slow or failed restore must not eat the job: carry on and download.
      - name: Restore apt .deb cache
        id: apt-cache
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/apt-debs/*.deb
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Install Japanese fonts + ffmpeg
        id: install
        timeout-minutes: 6
        run: |
          mkdir -p ~/apt-debs/partial
          apt_opts=(-o Dir::Cache::Archives="$HOME/apt-debs" -o Acquire::Retries=3)
          pkgs=(fonts-noto-cjk fonts-noto-cjk-extra ffmpeg)
          # Only the download is time-limited and retried (killing it leaves no
          # half-installed packages; finished .deb files are kept for attempt 2).
          for attempt in 1 2; do
            if timeout 120 sudo apt-get install --download-only -y "${apt_opts[@]}" "${pkgs[@]}"; then
              break
            fi
            if [ "$attempt" = 2 ]; then
              echo "::error::apt could not download fonts + ffmpeg in time (slow Ubuntu mirror?). Failing red instead of running into the job timeout."
              exit 1
            fi
            echo "::warning::apt download attempt $attempt timed out or failed; retrying (finished .deb files are kept)"
          done
          # Install once from the cache only, never touching the network.
          sudo apt-get install -y --no-download "${apt_opts[@]}" "${pkgs[@]}"
          # Drop superseded versions so the cache does not grow forever.
          sudo apt-get "${apt_opts[@]}" autoclean
          fc-cache -fv
          ffmpeg -version | head -1

      # Saved even when the install failed (under a one-off "partial" key), so
      # the .deb files that did arrive are not downloaded again next time.
      - name: Save apt .deb cache
        if: always() && steps.apt.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/apt-debs/*.deb
          key: ${{ steps.install.outcome == 'success' && steps.apt.outputs.key || format('{0}partial-{1}-{2}', steps.apt.outputs.prefix, github.run_id, github.run_attempt) }}

      - name: Install dependencies
        run: npm ci

      - name: Decide mode
        id: mode
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          SAMPLE: ${{ inputs.sample }}
        run: |
          # Samples / forced fallback are never posted, even on main.
          if [ "${GITHUB_REF}" != "refs/heads/main" ] || [ "${DRY_RUN_INPUT}" = "true" ] || { [ -n "${SAMPLE}" ] && [ "${SAMPLE}" != "today" ]; }; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Verification mode on ${GITHUB_REF} (sample=${SAMPLE:-today}): no posting, no commit."
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi
          case "${SAMPLE}" in
            sample) echo "args=--content=data/samples/brew-lesson.sample.json" >> "$GITHUB_OUTPUT" ;;
            fallback) echo "args=--fallback" >> "$GITHUB_OUTPUT" ;;
            *) echo "args=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run pipeline
        run: node scripts/pipeline.mjs ${{ steps.mode.outputs.args }}
        env:
          TZ: Asia/Tokyo
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          SNS_POST_ENABLED: ${{ steps.mode.outputs.dry_run != 'true' && secrets.SNS_POST_ENABLED || 'false' }}
          # YouTube
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Instagram
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          # GitHub (auto-provided, used for Release creation)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Buffer: disabled unless explicitly enabled after review. Drafts only.
          BUFFER_DRAFTS_ENABLED: ${{ steps.mode.outputs.dry_run != 'true' && vars.BUFFER_DRAFTS_ENABLED == 'true' && 'true' || 'false' }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_DRAFT_STATE_BACKEND: github

      - name: Commit performance history
        # always(): a post that failed part-way still recorded what aired (pipeline Step 7),
        # and the series needs that record to move on to the next episode tomorrow.
        if: always() && steps.mode.outputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/performance-history.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update performance history [skip ci]"
          # main may have moved during the ~4 min job (the routine's content PR,
          # another workflow). A lost record means the series re-airs today's
          # episode tomorrow, so a failed push must turn the job red, not green.
          for attempt in 1 2; do
            git pull --rebase origin main
            if ! jq empty data/performance-history.json; then
              echo "performance-history.json is not valid JSON after rebase; not pushing."
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt); pulling again."
          done
          echo "Could not push performance history — today's aired episode is not recorded."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload video artifact
        if: steps.mode.outputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coffee-video-${{ github.run_number }}
          path: |
            output/coffee-*.mp4
            output/youtube-thumbnail.jpg
          retention-days: 30

      - name: Upload verification artifact
        if: steps.mode.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coffee-dryrun-${{ github.run_number }}
          path: |
            output/coffee-*.mp4
            output/coffee-*-cover.jpg
            output/captions.json
            output/trending-data.json
            output/previews/*.png
          retention-days: 30

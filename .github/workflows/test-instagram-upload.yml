name: Test Instagram Upload (manual)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag containing the video asset (e.g., v20260425)"
        required: true
      asset_name:
        description: "Asset filename in the release (e.g., coffee-20260425.mp4)"
        required: true
      regenerate_captions:
        description: "Ignore the captions archived in the release and rebuild them from the repo's content JSON (only correct on the same JST day as the post)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download video asset
        run: |
          mkdir -p output
          gh release download "${{ inputs.release_tag }}" \
            -p "${{ inputs.asset_name }}" \
            -D output/
          ls -la "output/${{ inputs.asset_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate captions
        run: |
          # Prefer the captions archived with the original post (an older
          # date's recipe numbers must match its video); regenerate for releases
          # created before the archive existed, or when asked to.
          CAPTIONS_ASSET="${ASSET_NAME%.mp4}-captions.json"
          if [ "$REGENERATE_CAPTIONS" != "true" ] && gh release download "$RELEASE_TAG" -p "$CAPTIONS_ASSET" -D output/ --clobber; then
            cp "output/$CAPTIONS_ASSET" output/captions.json
            echo "Using archived captions ($CAPTIONS_ASSET)"
          else
            node scripts/scrape-coffee-news.mjs
            node scripts/generate-data.mjs
            node scripts/generate-caption.mjs
          fi
        env:
          TZ: Asia/Tokyo
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          REGENERATE_CAPTIONS: ${{ inputs.regenerate_captions }}

      - name: Upload to Instagram (resumable)
        run: node scripts/upload-instagram.mjs --file="output/${{ inputs.asset_name }}"
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

name: Test Instagram Upload (manual)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact release tag vYYYYMMDD; inspect first"
        required: true
      asset_name:
        description: "Exact coffee-YYYYMMDD.mp4 in that release"
        required: true
      action:
        type: choice
        options: [inspect, retry, resume_before_publish, reconcile_published]
        default: inspect
        description: "Inspect first. Never retries an uncertain publish."
      video_sha256:
        description: "Video SHA-256 from inspect; required for every write action"
      captions_sha256:
        description: "Archived captions SHA-256 from inspect; required for every write action"
      confirmed_unpublished:
        type: boolean
        default: false
        description: "I checked this date was not posted; required for historical/legacy recovery"
      published_media_id:
        description: "Confirmed existing public media ID; reconcile_published only (never posts)"
      regenerate_captions:
        type: boolean
        default: false
        description: "Unsupported: true stops safely; exact archived captions are required"

permissions:
  contents: read
concurrency:
  group: coffee-instagram-publication
  cancel-in-progress: false

env:
  NODE_OPTIONS: ""
  NODE_DEBUG: ""
  NODE_DEBUG_NATIVE: ""
  DEBUG: ""
  RELEASE_TAG: ${{ inputs.release_tag }}
  ASSET_NAME: ${{ inputs.asset_name }}
  INSTAGRAM_RECOVERY_ACTION: ${{ inputs.action }}
  CONFIRM_VIDEO_SHA256: ${{ inputs.video_sha256 }}
  CONFIRM_CAPTIONS_SHA256: ${{ inputs.captions_sha256 }}
  CONFIRMED_UNPUBLISHED: ${{ inputs.confirmed_unpublished }}
  PUBLISHED_MEDIA_ID: ${{ inputs.published_media_id }}
  REGENERATE_CAPTIONS: ${{ inputs.regenerate_captions }}

jobs:
  prepare:
    if: github.repository == 'nannantown/coffee-daily-video' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      write_required: ${{ steps.plan.outputs.write_required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Inspect receipt and pin exact archived assets (GET only)
        id: plan
        run: node scripts/recover-instagram.mjs --prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
  recover:
    needs: prepare
    if: needs.prepare.outputs.write_required == 'true' && github.repository == 'nannantown/coffee-daily-video' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # Only the durable publication receipt; no new Secrets or other grants.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Recover Instagram only using pinned assets and durable claim
        run: node scripts/recover-instagram.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INSTAGRAM_RECOVERY_PLAN: ${{ needs.prepare.outputs.plan }}
          INSTAGRAM_RECEIPT_WRITE_ENABLED: "true"
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

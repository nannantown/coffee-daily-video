name: Instagram Connection Check (read-only)

# No schedule, push, PR, input-controlled endpoint, posting, or credential writes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coffee-instagram-connection-check
  cancel-in-progress: false

jobs:
  check-connection:
    if: github.repository == 'nannantown/coffee-daily-video' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NODE_OPTIONS: ""
      NODE_DEBUG: ""
      NODE_DEBUG_NATIVE: ""
      DEBUG: ""
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test with mock credentials only
        run: node --test scripts/check-instagram-connection.test.mjs
      - name: Check expected Instagram account (one GET)
        run: node scripts/check-instagram-connection.mjs
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

name: Re-upload YouTube Video (manual)

on:
  workflow_dispatch:
    inputs:
      old_video_id:
        description: "Existing YouTube video ID to delete (leave empty if the original upload never succeeded)"
        required: false
        default: ""
      release_tag:
        description: "Release tag holding the replacement mp4 (e.g., v20260425)"
        required: true
      asset_name:
        description: "mp4 asset filename (e.g., coffee-20260425.mp4)"
        required: true
      regenerate_captions:
        description: "Ignore the captions archived in the release and rebuild them from the repo's content JSON (only correct on the same JST day as the post)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  reupload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download replacement mp4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          gh release download "${{ inputs.release_tag }}" \
            -p "${{ inputs.asset_name }}" \
            -D output/
          ls -la "output/${{ inputs.asset_name }}"

      - name: Regenerate captions for upload
        env:
          TZ: Asia/Tokyo
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          REGENERATE_CAPTIONS: ${{ inputs.regenerate_captions }}
        run: |
          # Prefer the captions archived with the original post; regenerate for
          # releases created before the archive existed, or when asked to
          # (e.g. the archived captions themselves were rejected).
          CAPTIONS_ASSET="${ASSET_NAME%.mp4}-captions.json"
          if [ "$REGENERATE_CAPTIONS" != "true" ] && gh release download "$RELEASE_TAG" -p "$CAPTIONS_ASSET" -D output/ --clobber; then
            cp "output/$CAPTIONS_ASSET" output/captions.json
            echo "Using archived captions ($CAPTIONS_ASSET)"
          else
            node scripts/scrape-coffee-news.mjs
            node scripts/generate-data.mjs
            node scripts/generate-caption.mjs
          fi
          cat output/captions.json | head -20

      - name: Attempt to delete old YouTube video (non-blocking)
        if: inputs.old_video_id
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          OLD_VIDEO_ID: ${{ inputs.old_video_id }}
        run: |
          node -e '
          import("googleapis").then(async ({ google }) => {
            const oauth2 = new google.auth.OAuth2(
              process.env.YOUTUBE_CLIENT_ID,
              process.env.YOUTUBE_CLIENT_SECRET,
              "urn:ietf:wg:oauth:2.0:oob"
            );
            oauth2.setCredentials({ refresh_token: process.env.YOUTUBE_REFRESH_TOKEN });
            const youtube = google.youtube({ version: "v3", auth: oauth2 });
            try {
              await youtube.videos.delete({ id: process.env.OLD_VIDEO_ID });
              console.log("Deleted video:", process.env.OLD_VIDEO_ID);
            } catch (err) {
              console.error("Delete failed (non-blocking, delete manually in YT Studio):", err.message);
            }
          });
          '

      - name: Upload replacement video
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/upload-youtube.mjs --video="output/${{ inputs.asset_name }}"
